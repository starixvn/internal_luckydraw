<div class="row server-site super-grand-winner-details" ng-controller="SuperGrandWinnerDetailController as winnerDetailCtrl" super-grand-winner-detail-keyboard-event>
    <div class="row staff-info" ng-class="winnerDetailCtrl.getClass(winnerDetailCtrl.winner1.StaffCode)" is-focus="{{winnerDetailCtrl.winner1.IsFocus}}" focus-event>
        <div class="col-sm-7">
            <div class="col-sm-5">
                <img class="prize-number" ng-if="winnerDetailCtrl.winner1.PrizeNumber" ng-src="{{winnerDetailCtrl.winner1.PrizeNumber}}" src="" alt="" />
                <div class="avatar">
                    <img ng-if="!winnerDetailCtrl.winner1" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winner-pic.jpg" src="" alt="" />
                    <img ng-if="winnerDetailCtrl.winner1" ng-src="data:image/png;base64,{{winnerDetailCtrl.winner1.Avatar}}" src="" alt="" />
                </div>
            </div>
            <div class="col-sm-7" ng-if="winnerDetailCtrl.winner1">
                <div class="row line" ng-bind="winnerDetailCtrl.winner1.FullName"></div>
                <div class="row line" ng-bind="winnerDetailCtrl.winner1.NickName"></div>
                <div class="row line" ng-bind="winnerDetailCtrl.winner1.Department.Name"></div>
            </div>
        </div>
        <div class="col-sm-5">
            <img ng-src="data:image/png;base64,{{winnerDetailCtrl.winnerDetail.Prizes[0].Image}}" src="" alt="" />
        </div>
    </div>
    <div class="row staff-info" ng-class="winnerDetailCtrl.getClass(winnerDetailCtrl.winner2.StaffCode)" is-focus="{{winnerDetailCtrl.winner2.IsFocus}}" focus-event>
        <div class="col-sm-7">
            <div class="col-sm-5">
                <img class="prize-number" ng-if="winnerDetailCtrl.winner2.PrizeNumber" ng-src="{{winnerDetailCtrl.winner2.PrizeNumber}}" src="" alt="" />
                <div class="avatar">
                    <img ng-if="!winnerDetailCtrl.winner2" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winner-pic.jpg" src="" alt="" />
                    <img ng-if="winnerDetailCtrl.winner2" ng-src="data:image/png;base64,{{winnerDetailCtrl.winner2.Avatar}}" src="" alt="" />
                </div>
            </div>
            <div class="col-sm-7" ng-if="winnerDetailCtrl.winner2">
                <div class="row line" ng-bind="winnerDetailCtrl.winner2.FullName"></div>
                <div class="row line" ng-bind="winnerDetailCtrl.winner2.NickName"></div>
                <div class="row line" ng-bind="winnerDetailCtrl.winner2.Department.Name"></div>
            </div>
        </div>
        <div class="col-sm-5">
            <img ng-src="data:image/png;base64,{{winnerDetailCtrl.winnerDetail.Prizes[1].Image}}" src="" alt="" />
        </div>
    </div>
    <div class="row staff-info" ng-class="winnerDetailCtrl.getClass(winnerDetailCtrl.winner3.StaffCode)" is-focus="{{winnerDetailCtrl.winner3.IsFocus}}" focus-event>
        <div class="col-sm-7">
            <div class="col-sm-5">
                <img class="prize-number" ng-if="winnerDetailCtrl.winner3.PrizeNumber" ng-src="{{winnerDetailCtrl.winner3.PrizeNumber}}" src="" alt="" />
                <div class="avatar">
                    <img ng-if="!winnerDetailCtrl.winner3" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winner-pic.jpg" src="" alt="" />
                    <img ng-if="winnerDetailCtrl.winner3" ng-src="data:image/png;base64,{{winnerDetailCtrl.winner3.Avatar}}" src="" alt="" />
                </div>
            </div>
            <div class="col-sm-7" ng-if="winnerDetailCtrl.winner3">
                <div class="row line" ng-bind="winnerDetailCtrl.winner3.FullName"></div>
                <div class="row line" ng-bind="winnerDetailCtrl.winner3.NickName"></div>
                <div class="row line" ng-bind="winnerDetailCtrl.winner3.Department.Name"></div>
            </div>
        </div>
        <div class="col-sm-5">
            <img ng-src="data:image/png;base64,{{winnerDetailCtrl.winnerDetail.Prizes[2].Image}}" src="" alt="" />
        </div>
    </div>
</div>
