<div class="col-sm-12 server-site super-grand-winner-details" ng-controller="SuperGrandWinnerDetailController as winnerDetailCtrl" super-grand-winner-detail-keyboard-event>    
    <div class="row box-container">
        <div class="logo-prize super-grand"></div>
        <div class="logo-small"></div>
        <div class="col-sm-7">
            <div class="winnerList" ng-class="winnerDetailCtrl.getClass(winnerDetailCtrl.winner1.StaffCode)" is-focus="{{winnerDetailCtrl.winner1.IsFocus}}" focus-event>
                <div class="staff-info pink-staff">
                    <img class="prize-number" ng-if="winnerDetailCtrl.winner1.PrizeNumber && !winnerDetailCtrl.winnerDetail.IsSamePrize" 
                        ng-src="{{winnerDetailCtrl.winner1.PrizeNumber}}" src="" alt=""/>
                    <div class="avatar">
                        <img ng-if="!winnerDetailCtrl.winner1" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winnerimage-pink.png" src="" alt="" class="unknown" />
                        <img ng-if="winnerDetailCtrl.winner1" ng-src="data:image/png;base64,{{winnerDetailCtrl.winner1.Avatar}}" src="" alt="" class="photo" />
                    </div>
                    <div class="info" ng-if="winnerDetailCtrl.winner1">
                        <h2 class="text-uppercase txt-nickname" ng-bind="winnerDetailCtrl.winner1.FullName"></h2>
                        <p class="text-capitalize txt-fullname" ng-bind="winnerDetailCtrl.winner1.NickName"></p>
                        <p ng-bind="winnerDetailCtrl.winner1.Department.Name"></p>
                    </div>
                </div>
            </div>
            <div class="winnerList" ng-class="winnerDetailCtrl.getClass(winnerDetailCtrl.winner2.StaffCode)" is-focus="{{winnerDetailCtrl.winner2.IsFocus}}" focus-event>
                <div class="staff-info green-staff">
                    <img class="prize-number" ng-if="winnerDetailCtrl.winner2.PrizeNumber && !winnerDetailCtrl.winnerDetail.IsSamePrize"
                        ng-src="{{winnerDetailCtrl.winner2.PrizeNumber}}" src="" alt="" />
                    <div class="avatar">
                        <img ng-if="!winnerDetailCtrl.winner2" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winnerimage-green.png" src="" alt="" class="unknown" />
                        <img ng-if="winnerDetailCtrl.winner2" ng-src="data:image/png;base64,{{winnerDetailCtrl.winner2.Avatar}}" src="" alt="" class="photo" />
                    </div>
                    <div class="info" ng-if="winnerDetailCtrl.winner2">
                        <h2 class="text-uppercase txt-nickname" ng-bind="winnerDetailCtrl.winner2.FullName"></h2>
                        <p class="text-capitalize txt-fullname" ng-bind="winnerDetailCtrl.winner2.NickName"></p>
                        <p ng-bind="winnerDetailCtrl.winner2.Department.Name"></p>
                    </div>
                </div>
            </div>
            <div class="winnerList" ng-class="winnerDetailCtrl.getClass(winnerDetailCtrl.winner3.StaffCode)" is-focus="{{winnerDetailCtrl.winner3.IsFocus}}" focus-event>
                <div class="staff-info blue-staff">
                    <img class="prize-number" ng-if="winnerDetailCtrl.winner3.PrizeNumber && !winnerDetailCtrl.winnerDetail.IsSamePrize"
                        ng-src="{{winnerDetailCtrl.winner3.PrizeNumber}}" src="" alt="" />
                    <div class="avatar">
                        <img ng-if="!winnerDetailCtrl.winner3" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winnerimage-blue.png" src="" alt="" class="unknown" />
                        <img ng-if="winnerDetailCtrl.winner3" ng-src="data:image/png;base64,{{winnerDetailCtrl.winner3.Avatar}}" src="" alt="" class="photo" />
                    </div>
                    <div class="info" ng-if="winnerDetailCtrl.winner3">
                        <h2 class="text-uppercase txt-nickname" ng-bind="winnerDetailCtrl.winner3.FullName"></h2>
                        <p class="text-capitalize txt-fullname" ng-bind="winnerDetailCtrl.winner3.NickName"></p>
                        <p ng-bind="winnerDetailCtrl.winner3.Department.Name"></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-5">
            <div class="row prizePhoto" ng-if="!winnerDetailCtrl.winnerDetail.IsSamePrize" ng-repeat="prize in winnerDetailCtrl.winnerDetail.Prizes">
                <img ng-src="data:image/png;base64,{{prize.Image}}" src="" alt="" />
            </div>
            <div class="row" ng-if="winnerDetailCtrl.winnerDetail.IsSamePrize">
                <img ng-src="data:image/png;base64,{{winnerDetailCtrl.winnerDetail.Prizes[0].Image}}" src="" alt="" />
            </div>
        </div>
    </div>
</div>
