<div class="col-sm-12 server-site winner-details" ng-controller="WinnerDetailController as winnerDetailCtrl" winner-detail-keyboard-event>
    <div class="col-sm-12 box-container">
        <div class="logo-prize" ng-class="winnerDetailCtrl.getLogoByPrizeType(winnerDetailCtrl.prizeType)">
            <img ng-if="winnerDetailCtrl.prizeType == 3" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/grandprize-small.png" src="" alt="" class="img-responsive" />
            <img ng-if="winnerDetailCtrl.prizeType == 4" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/majorprize-small.png" src="" alt=""  class="img-responsive"/>
            <img ng-if="winnerDetailCtrl.prizeType == 5" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/cashprize-small.png" src="" alt="" class="img-responsive" />
        </div>        
         <div class="col-sm-12 col-md-6 winnerList">
            <div class="row staff-info pink-staff">
                <div class="avatar">
                    <img ng-show="!winnerDetailCtrl.pinkStaff" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winnerimage-pink.png" src="" alt="" class="unknown img-responsive" />
                    <img ng-show="winnerDetailCtrl.pinkStaff" ng-src="data:image/png;base64,{{winnerDetailCtrl.pinkStaff.Avatar}}" src="" alt="" class="photo img-responsive" />
                </div>
                <div class="info" ng-show="winnerDetailCtrl.pinkStaff">
                    <h2 class="text-uppercase txt-nickname" ng-bind="winnerDetailCtrl.pinkStaff.NickName"></h2>
                    <p class="text-capitalize txt-fullname" ng-bind="winnerDetailCtrl.pinkStaff.FullName"></p>
                    <p ng-bind="winnerDetailCtrl.pinkStaff.Department.Name"></p>
                </div>
            </div>
            <div class="row staff-info green-staff">
                <div class="avatar">
                    <img ng-show="!winnerDetailCtrl.greenStaff" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winnerimage-green.png" src="" alt="" class="unknown img-responsive" />
                    <img ng-show="winnerDetailCtrl.greenStaff" ng-src="data:image/png;base64,{{winnerDetailCtrl.greenStaff.Avatar}}" src="" alt="" class="photo img-responsive" />
                </div>
                <div class="info" ng-show="winnerDetailCtrl.greenStaff">
                    <h2 class="text-uppercase txt-nickname" ng-bind="winnerDetailCtrl.greenStaff.NickName"></h2>
                    <p class="text-capitalize txt-fullname" ng-bind="winnerDetailCtrl.greenStaff.FullName"></p>
                    <p ng-bind="winnerDetailCtrl.greenStaff.Department.Name"></p>
                </div>
            </div>
            <div class="row staff-info blue-staff">
                <div class="avatar">
                    <img ng-show="!winnerDetailCtrl.blueStaff" ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/winnerimage-blue.png" src="" alt="" class="unknown img-responsive" />
                    <img ng-show="winnerDetailCtrl.blueStaff" ng-src="data:image/png;base64,{{winnerDetailCtrl.blueStaff.Avatar}}" src="" alt="" class="photo img-responsive" />
                </div>
                <div class="info" ng-show="winnerDetailCtrl.blueStaff">
                    <h2 class="text-uppercase txt-nickname" ng-bind="winnerDetailCtrl.blueStaff.NickName"></h2>
                    <p class="text-capitalize txt-fullname" ng-bind="winnerDetailCtrl.blueStaff.FullName"></p>
                    <p ng-bind="winnerDetailCtrl.blueStaff.Department.Name"></p>
                </div>
            </div>
        </div>
        <div class="col-sm-12 col-md-6 prizePhoto">
            <img class="img-responsive" ng-if="winnerDetailCtrl.winnerDetail.Prize" ng-src="data:image/png;base64,{{winnerDetailCtrl.winnerDetail.Prize.Image}}" src="" alt="" class="img-responsive" />
        </div>
        <div class="logo-small">
            <img ng-src="{{winnerDetailCtrl.baseUrl}}Images/Winner/logo-Luckydraw-small.png" src="" alt="" class="img-responsive" />
        </div>
    </div>
</div>
