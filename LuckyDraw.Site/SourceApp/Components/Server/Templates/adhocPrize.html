<div class="col-sm-12 server-site adhoc-prize" ng-controller="AdhocPrizeController as adhocPrizeCtrl" adhoc-prize-keyboard-event>
    <div class="col-sm-12 box-container">
        <div class="logo-prize adhoc">
            <img ng-src="{{adhocPrizeCtrl.baseUrl}}Images/Winner/adhocprize-small.png" src="" alt="" class="img-responsive" />
        </div>
         <div class="col-sm-12">
            <div class="col-sm-12 col-lg-3  current-winner">
                <div class="staff-info" ng-class="adhocPrizeCtrl.getCssClass(adhocPrizeCtrl.currentWinner.StaffCode)">
                    <div class="avatar">
                        <img ng-if="!adhocPrizeCtrl.currentWinner" ng-src="{{adhocPrizeCtrl.baseUrl}}Images/Winner/winner-pic-lg.png" src="" alt="" class="unknown-lg" />
                        <img ng-if="adhocPrizeCtrl.currentWinner" ng-src="data:image/png;base64,{{adhocPrizeCtrl.currentWinner.Avatar}}" src="" alt="" class="photo img-responsive" />
                    </div>
                    <div class="info">
                        <h2 class="text-uppercase txt-nickname" ng-bind="adhocPrizeCtrl.currentWinner.NickName"></h2>
                        <p class="text-capitalize txt-fullname" ng-bind="adhocPrizeCtrl.currentWinner.FullName"></p>
                        <p ng-bind="adhocPrizeCtrl.currentWinner.Department.Name"></p>
                    </div>
                </div>                
            </div>            
            <div class="col-sm-12 col-lg-9">
                <div class="list-winner" ng-repeat="listWinner in adhocPrizeCtrl.winners">
                    <div class="col-sm-12 col-lg-3 winner" ng-repeat="winner in listWinner">
                        <div class="staff-info" ng-class="adhocPrizeCtrl.getCssClass(winner.StaffCode)" is-focus="{{winner.IsFocus}}" focus-event>
                            <div class="avatar">
                                <img ng-if="!winner.StaffId" ng-src="{{adhocPrizeCtrl.baseUrl}}Images/Winner/winner-pic.png" src="" alt="" class="unknown" />
                                <img ng-if="winner.StaffId" ng-src="data:image/png;base64,{{winner.Avatar}}" src="" alt="" class="photo img-responsive" />
                            </div>
                            <div class="info">
                                <h2 class="text-uppercase txt-nickname" ng-bind="winner.NickName"></h2>
                                <p class="text-capitalize txt-fullname" ng-bind="winner.FullName"></p>
                                <p class="txt-department" ng-bind="winner.Department.Name"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="logo-small">
            <img ng-src="{{adhocPrizeCtrl.baseUrl}}Images/Winner/logo-Luckydraw-small.png" src="" alt="" class="img-responsive" />
        </div>
        <div class="quantity">
            {{adhocPrizeCtrl.currentQuantity}}/{{adhocPrizeCtrl.prizeSetting.Quantity}}
        </div>
    </div>
</div>
