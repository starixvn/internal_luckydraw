<div class="row server-site winner-details" ng-controller="WinnerDetailsController as winnerDetailsCtrl">
    <div class="row staff-info pink-staff">
        <div class="col-sm-4">
            <div class="avatar">
                <img ng-show="!winnerDetailsCtrl.pinkStaff" ng-src="{{winnerDetailsCtrl.baseUrl}}Images/Winner/winnerimage-pink.jpg" src="" alt="" />
                <img ng-show="winnerDetailsCtrl.pinkStaff" ng-src="data:image/jpeg;base64,{{winnerDetailsCtrl.pinkStaff.Avatar}}" src="" alt="" />
            </div>
        </div>
        <div class="col-sm-6" ng-show="winnerDetailsCtrl.pinkStaff">
            <div class="row line">
                <div class="col-sm-4" data-translate="FullName"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.pinkStaff.FullName"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="Code"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.pinkStaff.BarCode"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="NickName"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.pinkStaff.NickName"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="Department"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.pinkStaff.Department.Name"></div>
            </div>
        </div>
    </div>
    <div class="row staff-info green-staff">
        <div class="col-sm-4">
            <div class="avatar">
                <img ng-show="!winnerDetailsCtrl.greenStaff" ng-src="{{winnerDetailsCtrl.baseUrl}}Images/Winner/winnerimage-green.jpg" src="" alt="" />
                <img ng-show="winnerDetailsCtrl.greenStaff" ng-src="data:image/jpeg;base64,{{winnerDetailsCtrl.greenStaff.Avatar}}" src="" alt="" />
            </div>
        </div>
        <div class="col-sm-6" ng-show="winnerDetailsCtrl.greenStaff">
            <div class="row line">
                <div class="col-sm-4" data-translate="FullName"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.greenStaff.FullName"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="Code"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.greenStaff.BarCode"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="NickName"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.greenStaff.NickName"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="Department"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.greenStaff.Department.Name"></div>
            </div>
        </div>
    </div>
    <div class="row staff-info blue-staff">
        <div class="col-sm-4">
            <div class="avatar">
                <img ng-show="!winnerDetailsCtrl.blueStaff" ng-src="{{winnerDetailsCtrl.baseUrl}}Images/Winner/winnerimage-blue.jpg" src="" alt="" />
                <img ng-show="winnerDetailsCtrl.blueStaff" ng-src="data:image/jpeg;base64,{{winnerDetailsCtrl.blueStaff.Avatar}}" src="" alt="" />
            </div>
        </div>
        <div class="col-sm-6" ng-show="winnerDetailsCtrl.blueStaff">
            <div class="row line">
                <div class="col-sm-4" data-translate="FullName"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.blueStaff.FullName"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="Code""></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.blueStaff.BarCode"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="NickName"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.blueStaff.NickName"></div>
            </div>
            <div class="row line">
                <div class="col-sm-4" data-translate="Department"></div>
                <div class="col-sm-8" ng-bind="winnerDetailsCtrl.blueStaff.Department.Name"></div>
            </div>
        </div>
    </div>
</div>
