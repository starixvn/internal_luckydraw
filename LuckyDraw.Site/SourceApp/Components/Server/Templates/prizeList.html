<div class="col-sm-12 server-site" ng-controller="PrizeListController as prizeListCtrl" 
    ng-class="prizeListCtrl.getClassByPrizeType(prizeListCtrl.prizeType)" prize-list-keyboard-event>
    <div class="col-sm-12 box-container">
        <div class="logo-prize" ng-class="prizeListCtrl.getLogoByPrizeType(prizeListCtrl.prizeType)">
            <img ng-if="prizeListCtrl.prizeType == 2" ng-src="{{prizeListCtrl.baseUrl}}Images/Winner/supergrandprize-small.png" src="" alt="" />
            <img ng-if="prizeListCtrl.prizeType == 3" ng-src="{{prizeListCtrl.baseUrl}}Images/Winner/grandprize-small.png" src="" alt="" />
            <img ng-if="prizeListCtrl.prizeType == 4" ng-src="{{prizeListCtrl.baseUrl}}Images/Winner/majorprize-small.png" src="" alt="" />
            <img ng-if="prizeListCtrl.prizeType == 5" ng-src="{{prizeListCtrl.baseUrl}}Images/Winner/cashprize-small.png" src="" alt="" />
        </div>
        <div class="logo-small"></div>
        <div class="listPrize" ng-repeat="prizeList in prizeListCtrl.prizeList">
            <div class="prize" ng-repeat="prize in prizeList">
                <img src='' ng-src="{{prizeListCtrl.baseUrl}}{{prize.ImagePath}}" alt='' class="img-responsive" />
            </div>
        </div>
    </div>
</div>
