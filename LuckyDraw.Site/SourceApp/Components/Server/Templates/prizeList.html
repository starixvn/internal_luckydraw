<div class="row server-site" ng-controller="PrizeListController as prizeListCtrl" 
    ng-class="prizeListCtrl.getClassByPrizeType(prizeListCtrl.prizeType)" prize-list-keyboard-event>
    <div class="row" ng-repeat="listPrize in prizeListCtrl.listPrize">
        <div ng-repeat="prize in listPrize">
            <div class="col-sm-3">
                <img src='' ng-src="{{prizeListCtrl.baseUrl}}{{prize.ImagePath}}" alt='' />
            </div>
        </div>
    </div>
</div>
