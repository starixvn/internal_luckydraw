<div class="col-sm-12 advanced-zone" ng-controller="AdvancedController as advancedCtrl">
    <div class="logo-opening">
        <img ng-src="{{advancedCtrl.baseUrl}}Images/logo-2018.png" src="" alt="LuckyDraw" width="600" class="img-responsive" />
    </div>
    <div class="box-container">
        <div ng-show="advancedCtrl.unlockAdvancedZone">
            <div class="row search-autocomplete">
                <div class="col-sm-8 col-sm-offset-2">
                    <input type="text" class="form-control" ng-model="advancedCtrl.query"
                    placeholder="Enter code or full name or nick name or department"
                    search-auto-complete search-staffs="advancedCtrl.getStaff()" staff="advancedCtrl.staff" send-staff-code="advancedCtrl.sendStaffCode()" />
                </div>                
            </div>
            <div class="row staff-info" ng-class="advancedCtrl.getCssClass(advancedCtrl.staff.StaffCode)">
                <div class="avatar">
                    <img ng-show="!advancedCtrl.staff" ng-src="{{advancedCtrl.baseUrl}}Images/Winner/winner-pic.png" src="" alt="" class="unknown" />
                    <img ng-show="advancedCtrl.staff" ng-src="data:image/jpeg;base64,{{advancedCtrl.staff.Avatar}}" src="" alt="" class="img-responsive photo" />
                </div>
                <div class="info" ng-show="advancedCtrl.staff">
                    <p class="txt-nickname" ng-bind="advancedCtrl.staff.NickName"></p>
                    <p ng-bind="advancedCtrl.staff.FullName"></p>
                    <p ng-bind="advancedCtrl.staff.Department.Name"></p>
                </div>
            </div>
            <div class="message-box" role="alert" ng-show="advancedCtrl.message">
                <div class="text-center" ng-bind="advancedCtrl.message"></div>
            </div>
        </div>
    </div>
</div>
