<div id="securePopup">
    <div class="modal-body">
        <input type="password" class="form-control" ng-model="secureCtrl.password" ng-enter="secureCtrl.ok()" placeholder="Please enter the password!" />
        <div class="alert-danger" role="alert" ng-show="secureCtrl.error" ng-bind="secureCtrl.error"></div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary" ng-click="secureCtrl.ok()" data-translate="OK"></button>
    </div>
</div>
