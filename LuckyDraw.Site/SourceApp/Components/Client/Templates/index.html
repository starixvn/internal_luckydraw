<div class="col-sm-12 client-site" ng-controller="ClientController as clientCtrl" client-keyboard-event>
    <div class="logo-opening">
        <img ng-src="{{clientCtrl.baseUrl}}Images/logo-Luckydraw.png" src="" alt="LuckyDraw" class="img-responsive" />
    </div>
    <div class="box-container">
        <div class="col-sm-12 staff-info" ng-class="clientCtrl.getCssClass()">
            <div class="avatar">
                <img ng-if="!clientCtrl.staff && !clientCtrl.grade" ng-src="{{clientCtrl.baseUrl}}Images/Winner/winner-pic.png" src="" alt="" class="unknown" />
                <img ng-if="!clientCtrl.staff && clientCtrl.grade == 10" ng-src="{{clientCtrl.baseUrl}}Images/Winner/winnerimage-pink.png" src="" alt="" class="unknown" />
                <img ng-if="!clientCtrl.staff && clientCtrl.grade == 11" ng-src="{{clientCtrl.baseUrl}}Images/Winner/winnerimage-green.png" src="" alt="" class="unknown" />
                <img ng-if="!clientCtrl.staff && clientCtrl.grade == 12" ng-src="{{clientCtrl.baseUrl}}Images/Winner/winnerimage-blue.png" src="" alt="" class="unknown" />
                <img ng-if="clientCtrl.staff" ng-src="data:image/jpeg;base64,{{clientCtrl.staff.Avatar}}" src="" alt="" class="img-responsive photo" />
            </div>
            <div class="info">
                <div class="col-sm-12 line">
                    <div class="col-sm-4" data-translate="NickName"></div>
                    <div class="col-sm-8 txt-nickname" ng-bind="clientCtrl.staff.NickName"></div>
                </div>
                <div class="col-sm-12 line">
                    <div class="col-sm-4" data-translate="FullName"></div>
                    <div class="col-sm-8" ng-bind="clientCtrl.staff.FullName"></div>
                </div>
                <div class="col-sm-12 line">
                    <div class="col-sm-4" data-translate="Department"></div>
                    <div class="col-sm-8" ng-bind="clientCtrl.staff.Department.Name"></div>
                </div>
            </div>
        </div>
        <div class="message-box" role="alert" ng-if="clientCtrl.message">
            <div class="text-center" ng-bind="clientCtrl.message"></div>
        </div>
    </div>
</div>
