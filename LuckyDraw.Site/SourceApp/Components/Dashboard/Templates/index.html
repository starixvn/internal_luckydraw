<div class="row" ng-controller="DashboardController as dashboardCtrl" custom-event>
    <div class="staff-info col-sm-6">
        <div class="col-sm-6">
            <img style="width: 150px" ng-src="data:image/jpeg;base64,{{dashboardCtrl.staff.Avatar}}" src="" alt="" />
        </div>
        <div class="col-sm-6">
            <div class="row line" ng-bind="dashboardCtrl.staff.FullName">
            </div>
            <div class="row line" ng-bind="dashboardCtrl.staff.BarCode">
            </div>
            <div class="row line" ng-bind="dashboardCtrl.staff.NickName">
            </div>
            <div class="row line" ng-bind="dashboardCtrl.staff.Department.Name">
            </div>
        </div>
    </div>
</div>
