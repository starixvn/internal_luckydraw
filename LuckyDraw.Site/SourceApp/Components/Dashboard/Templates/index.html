<div class="col-sm-12 dashboard" ng-controller="DashboardController as dashboardCtrl" dashboard-keyboard-event>
    <div class="logo-opening">
        <img ng-src="{{dashboardCtrl.baseUrl}}Images/logo-Luckydraw.png" src="" alt="LuckyDraw" class="img-responsive" />
    </div>
    <div class="box-container">
        <div class="col-sm-12 text-center server">
            <button class="btn" ng-click="dashboardCtrl.redirectToServer()">Server</button>
        </div>
        <div class="col-sm-12 text-center client">
            <div class="col-sm-2">
                <button class="btn default-client" ng-click="dashboardCtrl.redirectToDefaultClient()">Default Client</button>
            </div>
            <div class="col-sm-2">
                <button class="btn pink-client" ng-click="dashboardCtrl.redirectToPinkClient()">Pink Client</button>
            </div>
            <div class="col-sm-2">
                <button class="btn green-client" ng-click="dashboardCtrl.redirectToGreenClient()">Green Client</button>
            </div>
            <div class="col-sm-2">
                <button class="btn blue-client" ng-click="dashboardCtrl.redirectToBlueClient()">Blue Client</button>
            </div>
            <div class="col-sm-2">
                <button class="btn" ng-click="dashboardCtrl.redirectToAdvancedZone()">Advanced Zone</button>
            </div>
        </div>
    </div>
</div>
