<div class="col-sm-12 dashboard" ng-controller="DashboardController as dashboardCtrl" dashboard-keyboard-event>
    <div class="logo-opening">
        <img ng-src="{{dashboardCtrl.baseUrl}}Images/logo-Luckydraw.png" src="" alt="LuckyDraw" class="img-responsive" />
    </div>
    <div class="box-container">
        <div class="col-sm-12 text-center server">
            <button class="btn btn-server" ng-click="dashboardCtrl.redirectToServer()">Server</button>
        </div>
        <div class="col-sm-12 text-center client">
            <button class="btn btn-default" ng-click="dashboardCtrl.redirectToDefaultClient()">Default Client</button>
            <button class="btn btn-pink" ng-click="dashboardCtrl.redirectToPinkClient()">Pink Client</button>
            <button class="btn btn-green" ng-click="dashboardCtrl.redirectToGreenClient()">Green Client</button>
            <button class="btn btn-blue" ng-click="dashboardCtrl.redirectToBlueClient()">Blue Client</button>
            <button class="btn btn-advanced" ng-click="dashboardCtrl.redirectToAdvancedZone()">Advanced Zone</button>
        </div>
    </div>
</div>
